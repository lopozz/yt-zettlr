[project]
name = "queen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistral-common>=1.10.0",
    "openai>=2.30.0",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "ruff>=0.15.9",
    "secretstorage>=3.5.0",
    "transformers>=5.3.0",
    "yt-dlp[curl-cffi,default]>=2026.7.4",
]

[project.scripts]
queen = "scripts.main_zttlr:main"
youtube-captions = "scripts.main_captios:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]
